seed: 42
device: cuda
dataset_config: config/dataset_config.yaml
model_config: config/ablations_leak/model_full.yaml
training:
  batch_size: 16
  grad_accum_steps: 2
  num_epochs: 30
  learning_rate: 2.0e-05
  warmup_steps: 1000
  weight_decay: 0.01
  max_grad_norm: 1.0
  label_smoothing: 0.1
  coverage_loss_weight: 0.15
  diversity_loss_weight: 0.1
  num_workers: 0
  pin_memory: true
  fp16: true
  early_stopping_patience: 8
  early_stopping_metric: meteor
  checkpoint_every: 5
  log_every: 10
  val_log_samples: 5
  classification_loss_weight: 0.0
evaluation:
  batch_size: 8
  num_workers: 0
  max_length: 128
  min_length: 25
  length_penalty: 1.5
  coverage_penalty: 0.1
  beam_size: 3
  temperature: 1.0
  n_bootstrap: 1000
  confidence: 0.95
  seed: 42
paths:
  checkpoint_dir: checkpoints_leak_full
  log_dir: logs/training/runs
  eval_log_dir: logs/evaluation
  results_dir: results/ablations_leak/full
